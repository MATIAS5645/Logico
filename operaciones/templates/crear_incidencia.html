{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Reportar Incidencia - Lógico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-brand"><i class="bi bi-box-seam text-primary"></i> LÓGICO</div>
        <div class="sidebar-heading">Navegación</div>
        <a href="{% url 'dashboard' %}" class="nav-item-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="{% url 'listado_incidencias' %}" class="nav-item-custom active"><i class="bi bi-exclamation-triangle"></i> Incidencias</a>
    </div>

    <div id="main-content">
        <div class="topbar mb-4">
            <h4 class="text-white mb-0">Registrar Nueva Incidencia</h4>
            <span class="text-secondary">Ingrese los detalles del suceso reportado desde la ruta</span>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase">Pedido Relacionado</label>
                            {{ form.movimiento }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase">Repartidor que reporta</label>
                            {{ form.motorista }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase">Nivel de Severidad</label>
                            {{ form.tipo }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase">Descripción del suceso</label>
                            {{ form.descripcion }}
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i>Guardar Reporte
                            </button>
                            <a href="{% url 'listado_incidencias' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
